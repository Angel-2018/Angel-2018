<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#14263A"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E3A52" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)" opacity="0.5"/>

  <!-- Sweeping light line -->
  <rect x="-300" y="0" width="260" height="260" fill="url(#sweep)" opacity="0.18">
    <animate attributeName="x" values="-300;1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <text x="60" y="110" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#F4F7FB">Angel Ezequiel Lozano Flores</text>
  <text x="60" y="142" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#FFD166" letter-spacing="3">SOFTWARE DEVELOPER · WEB & SYSTEMS</text>

  <!-- Rotating roles -->
  <g font-family="Courier New, monospace" font-size="26" fill="#00E5FF">
    <text x="60" y="200" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="10s" repeatCount="indefinite"/>
      &gt; Web apps with React &amp; Node.js_
    </text>
    <text x="60" y="200" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.5;1" dur="10s" repeatCount="indefinite"/>
      &gt; REST APIs that feel instant_
    </text>
    <text x="60" y="200" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
      &gt; Clean APIs and solid backends_
    </text>
    <text x="60" y="200" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="10s" repeatCount="indefinite"/>
      &gt; Manufacturing software that works_
    </text>
  </g>

  <!-- Blinking status dot -->
  <circle cx="930" cy="40" r="7" fill="#3CFF9A">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="830" y="45" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8FA9BF">available</text>
</svg>
